<section class="exhibit" aria-labelledby="smiley-title">
  <header class="exhibit__head">
    <p class="eyebrow">Exhibit</p>
    <h2 id="smiley-title" class="page-title">
      A smile, made of <em>boxes</em>.
    </h2>
    <p class="lede">
      No image, no vector, nothing pinned in place. Every feature is a grid
      cell, sized against the face itself, so the whole thing follows whichever
      screen you are holding.
    </p>
  </header>

  <figure class="plate">
    <div class="frame">
      <span class="ring" aria-hidden="true"></span>
      <div class="face" role="img" aria-label="A smiling face">
        <div class="eyes">
          <span class="eye"></span>
          <span class="eye"></span>
        </div>
        <div class="grin">
          <span class="cheek"></span>
          <span class="mouth"></span>
          <span class="cheek"></span>
        </div>
      </div>
    </div>

    <figcaption class="plate__caption">
      <p class="eyebrow">Plate I</p>
      <dl class="ledger">
        <div class="ledger__row">
          <dt>Material</dt>
          <dd>Boxes, borders and gradients</dd>
        </div>
        <div class="ledger__row">
          <dt>Placement</dt>
          <dd>Grid cells; nothing pinned</dd>
        </div>
        <div class="ledger__row">
          <dt>Measure</dt>
          <dd>Its own width, so it scales with the screen</dd>
        </div>
      </dl>
    </figcaption>
  </figure>
</section>
