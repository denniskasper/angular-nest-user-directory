<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" routerLink="/" aria-label="User Directory home">
      <span class="brand__mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
      <h1 class="brand__name"><em>User</em> Directory</h1>
    </a>
    <nav class="nav" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
        >Directory</a
      >
      <a
        routerLink="/users/new"
        routerLinkActive="nav__link--active"
        class="nav__link"
        >Add a User</a
      >
      <a
        routerLink="/smiley"
        routerLinkActive="nav__link--active"
        class="nav__link"
        >Smiley</a
      >
    </nav>
  </div>
  <span class="thread" aria-hidden="true"></span>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="foot">
  <div class="foot__inner">
    <span class="foot__mark" aria-hidden="true"></span>
    <p class="foot__text">User Directory · Roles are {{ roles.join(', ') }}</p>
    <span class="foot__version">v{{ version }}</span>
  </div>
</footer>
