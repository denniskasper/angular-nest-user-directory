<!-- One region per tone, both always in the document: a success is read
     when convenient, an error interrupts. -->
<div class="region" role="status" aria-atomic="true">
  @if (success(); as notice) {
  <ng-container *ngTemplateOutlet="slip; context: { notice }" />
  }
</div>
<div class="region" role="alert" aria-atomic="true">
  @if (error(); as notice) {
  <ng-container *ngTemplateOutlet="slip; context: { notice }" />
  }
</div>

<ng-template #slip let-notice="notice">
  <div class="notice" [attr.data-tone]="notice.tone">
    <span class="notice__mark" aria-hidden="true"></span>
    <p class="notice__text">{{ notice.text }}</p>
    <button
      type="button"
      class="icon-button notice__dismiss"
      aria-label="Dismiss"
      (click)="notices.dismiss()"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>
</ng-template>
